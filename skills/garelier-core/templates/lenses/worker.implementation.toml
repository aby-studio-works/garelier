[lens_pack]
id = "worker.implementation"
role = "worker"
schema_version = 1
status = "active"
description = "Worker implementation focus groups."

[[groups]]
id = "reuse_first"
status = "active"
label = "Reuse-first minimal change"
description = """
Before writing new code, climb this ladder in order and stop at the first rung \
that fits: (1) an existing recurrence-prevention measure / past lesson for this \
area, (2) the project's conventions and coding standards, (3) existing code in \
this repo, (4) the standard library, (5) a platform feature, (6) an \
already-installed dependency, (7) a one-line solution — only then write the \
minimum new code. Lazy about the solution, never about reading. Validation, \
error handling, and security are never minimized."""

[groups.focus]
primary = "smallest_correct_change_via_reuse_ladder"
secondary = "recurrence_prevention_then_conventions_then_existing"
avoid = "new_abstractions_speculative_generality_unneeded_dependencies"

[groups.limits]
may_not_override_role_contract = true
may_not_relax_must_block = true

[[groups]]
id = "minimal_patch"
status = "active"
label = "Minimal patch"
description = "Prefer a small, local change that follows existing project patterns."

[groups.focus]
primary = "small_correct_change"
secondary = "existing_patterns"
avoid = "unrelated_refactor"

[groups.limits]
may_not_override_role_contract = true
may_not_relax_must_block = true

[[groups]]
id = "robustness_first"
status = "active"
label = "Robustness first"
description = """
Front-load failure modes: enumerate edge cases, error / exception paths, and \
invalid inputs (and a brief plan) before implementing. For robustness-critical \
work or faster / cheaper model tiers. Still reuse before adding new code."""

[groups.focus]
primary = "failure_modes_and_edge_cases_first"
secondary = "brief_plan_before_code"
avoid = "happy_path_only"

[groups.limits]
may_not_override_role_contract = true
may_not_relax_must_block = true

[[groups]]
id = "evidence_first"
status = "active"
label = "Evidence first"
description = """
Decide what would count as proof before you decide what to build, and prefer the \
claim you can refute. Every claim of the form "this is connected / this is \
detected / this is prevented" needs both directions: the measure fires on the \
data that showed the defect, and the previous state does not fire on that same \
data. One direction alone is not evidence. Inject the check outside the blind \
spot you are testing, not where it already looks. Take a denominator from \
something outside the thing being judged, and say what you scanned, not only how \
many you found. A count with no denominator, a scanner reporting zero findings, \
a number identical to last time, and a predicate that only matches a spelling \
are all non-evidence. Close a gap in the positive form — what shape is allowed — \
rather than by listing forbidden shapes, because a list is broken by the case it \
omits. This composes with the reuse ladder: reuse decides what to build, this \
decides what proves it works."""

[groups.focus]
primary = "define_the_refutation_before_the_change"
secondary = "two_directional_counterfactual_and_external_denominator"
avoid = "one_directional_claims_self_declared_denominators_and_enumerated_prohibitions"

[groups.limits]
may_not_override_role_contract = true
may_not_relax_must_block = true
