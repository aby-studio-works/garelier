schema_version = 3
kind = "garelier_control"
pm_id = "{{PM_ID}}"
mode = "{{MODE}}"
storage = "plan_graph_markdown"

[control]
max_resume_bytes = 24576
max_primary_checkpoints = 1
direct_edit = true
closed_records = "tracked"
dashboard = "tracked_mixed"

[claims]
ttl_seconds = 1800
stale_after_seconds = 3600

[validation]
session_open_fail_on = "error"
completion_fail_on = "warning"
