# Garelier setup configuration
# Generated by garelier-pm setup wizard.
# Edit and re-run wizard with --mode diff to add/remove agents.

[project]
name = "{{project_name}}"
initialized_at = "{{ISO8601_timestamp}}"
garelier_version = "2.10.0"

[pm]
pm_id = "{{pm_id}}"

[branches]
target = "{{target_branch}}"                       # User-owned target (e.g., main)
target_slug = "{{target_slug}}"                    # Target with '/' replaced by '-'
integration = "garelier/{{target_slug}}/{{pm_id}}/studio"   # Shared integration branch for all execution routes

[runner]
# PM and Dock provider/model stay unset unless explicitly configured.
# Role routing is decided per task:
# explicit dispatch --provider / --model / --effort, then blueprint hints, then
# [model_routing] policy. Role metadata never selects a provider or model.
# pm_provider = "codex-cli"
# pm_model = "gpt-5.6-sol"
# pm_effort = "xhigh"
# dock_effort = "xhigh"

# Every role is a framework capability; fresh setup creates no fixed roster.
# dispatch_prepare creates an ephemeral task identity/home for Worker, Scout,
# Smith, Librarian, Observer, Guardian, Concierge, or Artisan as selected.

# === Optional project-declared dispatch environment ===
#
# [[dispatch.env]] is provider- and stack-neutral. Each declaration is expanded
# for its selected child class. Omit every declaration for no injection. Allowed
# placeholders: {checkout}, {project}, {container}, {dispatch_id}, {role}, {slug}.
# `why` is required; `applies_to` defaults to ["producer"] and may explicitly
# include "gate". Unknown placeholders, missing `why`, and empty expansion fail
# prepare before launch. Core-owned env wins on a name collision. Keep secrets
# out of this tracked config; put the operating rule in the consumer project's
# read_first knowledge and point it at garelier-core/references/dispatch_env.md.
# [[dispatch.env]]
# name = "PROJECT_CHECKOUT"
# value = "{checkout}"
# why = "Explain why this consumer project needs the value"
# applies_to = ["producer", "gate"]

# === Observer (read-only review/advice sidecar, DEC-019) ===
#
# Observer is a commit-free, read-only role that independently reviews
# diffs/reports before a studio merge by Dock or Artisan, and gives Workers
# non-binding code-direction advice. It never
# commits or merges, and may review work from every execution route. The policy
# below decides when Observer review is MANDATORY; when required, a missing
# PASS/PASS_WITH_NOTES blocks the merge (a BLOCK verdict always escalates to
# PM). The role is available without a configured Observer identity.
[observer_policy]
enabled = true                        # top-level switch; true to activate Observer gating
require_for_all_merges = true         # review EVERY merge — enforces worker→guardian→observer→dock (and artisan→guardian→observer→artisan); merge-gate REFUSES any merge lacking a passing Observer verdict. Set false to review only on the triggers below (cost↓, but small/benign merges go unreviewed).
require_for_artisan_premerge = true   # Artisan must pass Observer before studio integration
require_for_large_diff = true
large_diff_lines = 100                 # churn (added+deleted) at/above which Observer review is mandatory; default 100. (Dormant while require_for_all_merges = true, which already reviews every merge.)
require_for_protected_paths = true
require_for_public_api_change = true
require_for_migration = true
require_for_auth_security = true
allow_worker_direction_request = true
max_parallel_requests = 1
advice_is_binding = false

# === Guardian (security/privacy/dependency/license gate, DEC-024) ===
# Guardian is the security GATE: commit-free, on an ephemeral `gavel` branch,
# reads Librarian-owned security knowledge (the `security/` knowledge tree) and emits
# PASS / PASS_WITH_NOTES / BLOCK / NO_OPINION. The role is available without a
# configured Guardian identity.
[guardian_policy]
enabled = true
require_for_all_merges = true         # security-gate EVERY merge — the guardian step of worker→guardian→observer→dock; merge-gate REFUSES any merge lacking a passing Guardian verdict. Set false to gate only on the mechanical triggers below.
branch_namespace = "gavel"
# Gate timings (delta is the core; preflight/final are staged).
require_delta_before_observer = true
require_final_before_merge = true
require_for_artisan_premerge = true
require_for_promote = true
# Mechanical triggers (when a gate is mandatory).
require_for_dependency_changes = true
require_for_lockfile_changes = true
require_for_auth_security = true
require_for_config_infra_ci_deploy = true
require_for_protected_paths = true
# Blocking rules.
block_on_secret = true
block_on_pii = true
block_on_customer_data = true
block_on_private_key = true
block_on_critical_vulnerability = true
block_on_high_vulnerability = true
block_on_forbidden_license = true
block_on_unknown_license = false
block_when_required_scanner_unavailable = true
# Output safety.
redact_evidence = true
forbid_secret_value_in_report = true

[guardian_policy.security_sensitive_paths]
paths = [".env*", "**/*.pem", "**/*.key", "**/*secret*", "**/*credential*", "infra/**", "deploy/**", ".github/workflows/**", "migrations/**"]

[guardian_policy.package_files]
paths = ["package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "Cargo.toml", "Cargo.lock", "requirements.txt", "pyproject.toml", "poetry.lock", "go.mod", "go.sum"]

# Scanner commands. Empty = Guardian uses available project tools and reports
# NO_OPINION/BLOCK per policy if a required command is missing.
#
# PREREQUISITE: a named scanner must be installed + on PATH. Guardian runs as
# an in-session subagent, so the session's permissions must allow running the
# scanner (gitleaks by default); custom scanner commands may need project-local
# allowlist entries. If a MANDATORY scanner (secret / PII) is absent, the gate
# cannot PASS — it BLOCKs (block_when_required_scanner_unavailable = true,
# above). Default secret scanner is user-managed gitleaks; Garelier only resolves
# an existing executable and fails explicitly when the configured policy requires it
# gitleaks). The default below already uses the modern verb: `gitleaks detect`
# was deprecated in 8.19 (still runs, but hidden from --help; upstream migration
# gist: https://gist.github.com/zricethezav/b325bb93ebf41b9c0b0507acf12810d2)
# in favor of `gitleaks dir` (working-tree/file scan) or `gitleaks git` (a
# commit-range scan via `git log -p`) — see scanner-and-gates.md §2.
#
# Public / docs-only fallback when gitleaks cannot be used:
#   block_when_required_scanner_unavailable = false
#   secret_scan = "off"
# This keeps Guardian running in a degraded mode. Guardian must not claim full
# secret-scanner coverage; it reports the off setting in guardian_report.md and
# uses available git/Bun/text review instead.
#
# scanner_backend selects the secret-scanner backend that guardian_scan.ts
# normalizes and that scanner-and-gates.md invokes (W-065). Default "gitleaks"
# keeps behavior unchanged. "betterleaks" (github.com/betterleaks/betterleaks,
# MIT, gitleaks-team + Aikido) is an opt-in, lower-false-positive backend and is
# a supply-chain addition — install it only with owner approval. Its async HTTP
# token-liveness validation is kept OFF: it is disabled by default and only
# enabled by `--validation`, which guardian_scan.ts / Guardian never pass, so
# the read-only + non-network gate invariant holds.
[guardian_tools]
scanner_backend = "gitleaks"                 # "gitleaks" (default) | "betterleaks" (opt-in; HTTP validation forced off)
secret_scan = "gitleaks dir . --no-banner --redact --report-format json --report-path -"
pii_scan = ""
dependency_scan = ""
license_scan = ""
sast_scan = ""

# === Concierge (external operations executor / PM's delegate of last resort, DEC-025) ===
# Concierge EXECUTES PM-approved operations that leave Garelier's local sandbox.
# Phase 1 = promote_target (merge studio into target on its own worktree, quality
# gate on the merged tree, tag, push) + read-only sync_remote. It never implements
# source, decides policy, gates, pushes garelier/* branches, force-pushes, or runs
# a blind git pull. Reads Librarian-owned external_operations/ knowledge and
# consumes the Guardian promote_gate verdict. The role is available without a
# configured Concierge identity. Enabling policy does NOT auto-push: external
# writes still require an explicit user instruction behind the PM assignment.
[concierge_policy]
enabled = true
branch_namespace = "clipboard"
require_pm_approval = true
require_user_instruction_for_write = true
require_librarian_policy_sources = true
require_guardian_before_external_write = true
require_external_lock = true
forbid_push_garelier_branches = true
forbid_force_push = true
forbid_blind_git_pull = true
redact_sensitive_output = true
# Remote-visible work uses these prefixes — never garelier/* (Phase 2).
allowed_external_branch_prefixes = ["publish/", "pr/", "release/"]

[concierge_policy.required_knowledge]
paths = [
    "external_operations/external_operations_policy.md",
    "external_operations/git_remote_policy.md",
    "external_operations/promote_policy.md",
    "external_operations/rollback_policy.md",
]

[milestones]
current = []                # Filled by PM when milestones are defined

# === Lens defaults (focus only; never authority) ===
#
# A Lens Group tunes judgment focus for a role. It cannot change permissions,
# write paths, MUST BLOCK conditions, or handoff format. PM may override per
# blueprint in `## Lens selection`.
[lenses.defaults]
pm = "pm.planning:delivery_balanced"
dock = "dock.dispatch:balanced"
worker = "worker.implementation:reuse_first"
scout = "scout.investigation:source_first"
smith = "smith.integration:adversarial_personas"
librarian = "librarian.source:strict"
guardian = "guardian.risk_control:strict"
observer = "observer.review:over_engineering"
concierge = "concierge.external_ops:explicit_only"
artisan = "artisan.creation:reuse_first"
wanderer = "wanderer.dialogue:sdd"

# === Status Web Console (read-only) ===
#
# A local, read-only browser view of Garelier state (routes, roles,
# branches, merge gate, recent reports, warnings, source/routine
# registries). Zero AI tokens — it only reads runtime files. Start it with
# `bun run status -- --pm-id <pm_id>` from the driver directory, or
# `bun run skills/garelier-core/driver/src/status_web.ts --pm-id <pm_id>`.
# It is read-only and never mutates state. Default bind is LAN-reachable for
# watching from another PC on the same trusted network; use 127.0.0.1 for local
# only.
[status_web]
enabled = false              # informational; the standalone command runs regardless
host = "0.0.0.0"             # LAN; use "127.0.0.1" for loopback only
port = 3787
auto_refresh_seconds = 5
read_only = true             # phase 1 is read-only; no operation UI
show_source_urls = true      # false => show only the host of source registry URLs

# === Permissions (autonomy profile) ===
#
# Fresh setup writes no [permissions] table: setup does not persist or change
# the user's provider permissions. An explicit
# --permission-profile remains available as an advanced compatibility override.

# === Quality gate (DEC-007) ===
#
# Commands run by the merge-gate subprocess after
# 'git merge --no-ff --no-commit'. Each is a single shell line; failure of
# any aborts the merge. Garelier targets any large app, not just Rust: set
# `stack` to pick a default FULL command set, or list `commands` explicitly
# (back-compat alias for full.commands). stack = "custom" REQUIRES explicit
# full commands — setup is not complete until they are filled in.
#   rust         -> cargo check/test/clippy
#   typescript   -> typecheck / test / lint (no automatic install)
#   python       -> ruff / pytest (no automatic install)
#   go           -> go build / vet / test
#   mixed|custom -> none (list commands yourself)
[quality_gate]
stack = "custom"
commands = [
    # "npm run typecheck",
    # "npm test",
]
timeout_minutes_per_cmd = 120

# Optional RUNTIME-verification commands. `commands` above verify LOGIC (compile
# + unit tests); these verify RUNTIME EFFECT. The merge gate RUNs them on the
# MERGED result (merge-gate.ts Step 4b) in the PRIMARY checkout's warm
# target, AFTER the compile/test gate and BEFORE the commit — so a change that
# compiles and unit-tests clean but is WRONG AT RUNTIME still aborts the merge
# (it covers what a dispatch worktree cannot: a Worker can't reliably RUN a heavy
# artifact in its cold-target worktree). Each command must exit non-zero on
# failure. Default (absent / empty) = inert. Project-specific — put your app's
# headless functional smoke here (it must self-terminate, no window/input wait):
# run_verify_commands = [
#     # "<headless functional smoke that exits non-zero on failure>",
# ]

# Optional fast/full split. During bounded implementation batches, roles use
# fast when available. Merge gate, promote, and REPORTING/completion use full.
# `[quality_gate] commands` above remains a legacy alias for `[quality_gate.full]`.
[quality_gate.fast]
commands = [
    # "npm run typecheck",
]
timeout_minutes_per_cmd = 10

[quality_gate.full]
commands = [
    # "npm run typecheck",
    # "npm test",
]
timeout_minutes_per_cmd = 120

# Worker-authored register policy. gate_runner --from-register requires this
# complete project declaration and fails closed when it is absent. Garelier
# supplies no language/test-runner defaults here:
# - `steps` classify allowed register commands by project-owned prefixes.
# - `closure` is always appended as the terminal whole-project check, even when
#   the role omits it or places the same command earlier.
# - `coverage` maps every touched path (`git diff --name-only`) to one or more
#   declared step names; unmatched or unsatisfied paths block GREEN.
#   Do not list a `closure` name in `coverage.steps`: closure always runs, so
#   treating it as per-unit coverage would make the touched-path check a no-op.
#   The runner reports `COVERED_BY_CLOSURE_ONLY` and blocks GREEN.
# - `summary_patterns` selects verbatim evidence lines from this run only.
# - `test_trees` discovers project-defined tree markers and reports any marker
#   outside the complete declared root list.
# - optional `order_checks` classify writer/consumer argv by project-owned
#   literal argv patterns. Writer/consumer patterns match an argv prefix;
#   exclude patterns match a contiguous argv sequence. Every role pattern
#   must match a distinct step before
#   the first consumer; excluded variants do not count. No table means skip.
#
# [quality_gate.register]
# summary_patterns = [
#     "^SUMMARY ",
# ]
#
# [[quality_gate.register.steps]]
# name = "component-check"
# command_prefixes = [
#     "scripts/quality/check component",
# ]
#
# [[quality_gate.register.closure]]
# name = "whole-project"
# cmd = "scripts/quality/full"
#
# [[quality_gate.register.coverage]]
# paths = ["src/**"]
# steps = ["component-check"]
#
# [[quality_gate.register.order_checks]]
# name = "generated-inputs-before-readers"
# writer_patterns = ["scripts/build primary", "scripts/build secondary"]
# consumer_patterns = ["scripts/read generated"]
# writer_exclude_patterns = ["--inspect-only"]
# consumer_exclude_patterns = ["--self-sufficient"]
#
# [quality_gate.register.test_trees]
# marker_globs = ["checks/**/tree.marker"]
# roots = ["checks/declared"]

# Deterministic auto-FIX (formatter WRITE) commands (DEC-049 C1). A role
# runs these ONCE in its own dispatch worktree before its check gate so a
# formatting nit is fixed at the source instead of failing the expensive merge
# gate and forcing a rework cycle. With the section
# below ABSENT (as shipped), it DEFAULTS to the stack formatter (rust:
# `cargo fmt --all`, go: `go fmt ./...`, python: `ruff format .`; typescript
# varies so has no default). Uncomment to override; an explicit empty
# `commands = []` DISABLES autofix.
# [quality_gate.autofix]
# commands = [
#     "<the project's formatter, e.g. cargo fmt --all / ruff format . / go fmt ./...>",
# ]

# === Merge gate transient-failure retry (W-029) ===
#
# Opt-in, pattern-limited retry for the merge gate's quality-gate step. When a
# quality-gate command fails with output matching a fixed, hard-coded
# allowlist (currently: `error[E0463]` "can't find crate" cascades, and
# `undefined symbol ... anon.llvm`) — both are known parallel-compile /
# incremental-build artifact races, NOT real errors in the change under
# review — merge-gate.ts re-runs that ONE command ONCE. Any other failure is
# reported exactly as before (never retried). A successful retry is recorded
# visibly as `transient_retry` in the result JSON, never hidden.
# Default false = zero behavior change until a project opts in.
[merge_gate]
transient_retry = false

# === Merge gate data-only fast path (W-031) ===
#
# Opt-in shortcut for asset/data-heavy projects (e.g. a Cooker-driven asset
# pipeline): when EVERY file in a merge's diff matches one of
# `data_only_paths` — patterns matched against the repo-relative path with
# bash `[[ "$f" == $pat ]]` semantics, where an UNQUOTED `*` matches `/` too,
# so both "mods/**" and "assets/*" work as prefix matches — merge-gate.ts
# skips the (often expensive, e.g. a full Rust workspace compile)
# `[quality_gate]` commands and runs `data_only_commands` instead (a
# lightweight, project-owned check, e.g. a cooker/asset validator). Preflight
# (`transient_retry`'s sibling feature, W-023) still runs in BOTH modes; only
# the quality-gate step is replaced. BOTH lists below must be non-empty to
# activate — either left empty (the default) means every merge runs the FULL
# gate, unchanged from before this feature existed. The chosen mode
# ("data_only" | "full") and the classified file count are always recorded as
# `gate_mode` / `data_only_file_count` in the merge-gate result/summary JSON.
data_only_paths = [
    # "mods/**",
    # "assets/**",
    # "docs/**",
]
data_only_commands = [
    # "cargo run -p cooker_assets -- --validate-only",
]

# === Merge gate results retention (W-030 residual) ===
#
# results/ gets one `.json` + one `.summary.json` per merge request and has no
# other delete path (a long-running PM's results/ grows monotonically
# forever). Every result write — the merge-gate.ts subprocess path AND the
# driver's own synthetic-abort path — prunes down to the most recent
# `results_keep` request stems immediately afterward (write-time pruning, so
# a reader never observes a result vanish mid-read); a stem still referenced
# by a queued request or the active lock is protected regardless. Default 40.
results_keep = 40

# === Merge gate archive retention (W-038) ===
#
# archive/ gets one `<stem>.request.json` per resolved merge request and has
# the same monotonic-growth gap results/ had before W-030. Same write-time
# trigger as results_keep above, but AGE-based (mtime), not count-based:
# archived requests older than `archive_keep_days` are deleted; a stem still
# referenced by a queued request or the active lock is protected regardless.
# Default 14 (matches retention.md's `merge_gate_archive_keep_days` policy).
archive_keep_days = 14

# Optional preflight commands (W-023 / W-033). Lightweight, deterministic checks
# the merge gate runs right after the merge and BEFORE the (expensive) quality
# gate — a cheap problem fails in seconds instead of at the end of a multi-minute
# compile/test run. merge_request.ts reads this key when no --preflight flag is
# given, so the jig merge paths (main tick via dock_integrate, Smith window) opt
# in here without threading the flag per call. Single-line array. Absent / empty
# = no preflight step (behavior identical to before this key existed). Example for
# a Rust project (catches a stale Cargo.lock without compiling):
# preflight_commands = ["cargo metadata --locked --offline"]

# === Retention (high-volume operation) ===
#
# Defaults from garelier-core/retention.md. Tune when daily reports,
# Scout inspections, or runtime archives become high-volume.

[retention]
inspection_path_granularity = "month"
inspection_monthly_summary = true
runtime_archive_keep_days = 30
runtime_archive_keep_files = 300
merge_gate_archive_keep_days = 14
role_local_archive_keep_days = 30
# runtime/pm/scratch/ (agent-owned manual verify logs/screenshots) age-prune
# window in days; used only by the manual, dry-run-first scratch_retention.ts
# helper (never an automatic driver hook). 0 disables. (W-084(d))
scratch_keep_days = 14

# === Adaptive dispatch admission + priority tiers (W-330 / DEC-031) ===
#
# Garelier defines no fixed concurrent-agent cap. Admit each task from advertised
# provider/substrate availability plus current host CPU/memory/I/O pressure and
# task resource_class. A host quota (for example a provider account's current
# total slots) is external availability, never a framework config default.
[concurrency]
# Priority TIERS (highest first) decide who gets the NEXT free slot under
# contention. NOTE: "tier" is launch priority — distinct from the artisan/dock
# execution LANES (DEC-017, mutual exclusion). Within a tier, the longest-waiting
# agent runs first (FIFO).
#   tier 0  gates       — concierge/guardian/observer (external/safety/review that
#                         UNBLOCK or that the user waits on). Fixed top.
#   tier 1  smith,librarian   — hardening + knowledge. Dock-reorderable.
#   tier 2  worker,scout,artisan — roles. Worker/Scout FIFO when both run;
#                         Artisan is selected per task by PM routing.
#   tier 3  []          — RESERVED empty demotion tier: Dock can park a
#                         role here (e.g. push Smith below the Workers while
#                         they finish a big batch, then restore it) via the hint.
# Dock reorders its roles (smith/librarian/worker/scout) at runtime
# with runtime/dock/tier_order.json; the gate tier and Artisan are fixed.
tiers = [
    ["concierge", "guardian", "observer"],
    ["smith", "librarian"],
    ["worker", "scout", "artisan"],
    [],
]
# A candidate deferred this many consecutive dispatch rounds is promoted to the
# front — the cross-tier starvation breaker. 0 disables aging (strict tier order).
starvation_cycles = 3
#
# A RESERVED "urgent" priority tier (normally empty) sits ABOVE every role tier: a per-task
# `urgent.md` marker in the agent container (PM/Dock-written for a user "do
# this first") promotes that one instance to the front — so it never competes with
# the gate tier, and multiple urgents run in FIFO (request) order. Urgent does NOT
# preempt: running agents are never killed; the urgent task takes the next free slot.

# === Heavy-compile serialization (DEC-073 Part B) ===
#
# `[concurrency]` bounds AGENT COUNT, not build LOAD. On a RAM-bound box a
# worker's full workspace build (which can need tens of GB) running at the same
# time as the async merge gate's test compile (and/or an orphaned compile) can
# OOM and corrupt build output dirs (truncated objects, spurious link errors).
# This serializes the HEAVY-COMPILE INITIATORS across all layers (merge gate,
# driver/jig, interactive Dock) via a shared file lock
# (`bun scripts/heavy_compile_lock.ts`, slot dirs under
# `runtime/locks/heavy_compile/`). The initiator holds the lock for the
# compile's duration — never the subagent's discretion: the merge-gate
# subprocess wraps its quality gate; the Dock wraps a dispatched
# role's lifetime (acquire before the Agent/Workflow dispatch, release on
# return). Self-heals via pid-dead + idle + lease reclaim (W-024/W-156/W-169);
# acquire QUEUE-WAITS rather than ever executing lockless (a stalled holder is
# freed by reclaim, not by a fail-open) — so the pipeline can neither deadlock nor
# double-compile. (W-158: the former "fail-opens on timeout" behavior is retired.)
# A merge gate whose
# diff classifies data-only ([merge_gate] data_only_paths) runs no heavy compile,
# so it does NOT take this lock (W-024).
[heavy_compile]
enabled = true            # false -> lock is a no-op (builds are concurrency-safe)
max_concurrent = 1        # at most N heavy compiles at once; 0 = unlimited (no-op)
lease_minutes = 240       # HARD backstop: a slot older than this (or whose owner pid is dead) is reclaimable
stale_minutes = 30        # W-024: idle-reclaim — a slot older than this whose owner runs ZERO cargo/rustc (and is not a live pid) is stale, so a BLOCKED/orphaned hold cannot stall waiters for the full lease

# === Output control (DEC-028) ===
#
# Keeps role FINAL responses short, on top of the existing compact-handoff
# (durable role-to-role files) and retention. Each role gets an output
# profile; the dispatch prompt appends a short directive asking the subagent
# to keep its final response within the soft budget and put durable detail in
# official files. Over-budget responses are WARNED, not failed. (The
# driver_log_* keys are driver-era log-rotation knobs, tolerated for old
# configs.)
#
# Never shortens code, paths, commands, URLs, errors, dates, numbers, or SHAs,
# and never hides risks / blockers / warnings / approvals. Safety-leaning roles
# (guardian, concierge) default to `normal`.
[output_control]
enabled = true
default_profile = "compact"          # normal | compact | micro
violation_mode = "warn"              # warn (observe) | fail (experimental)
model_result_log_chars = 600         # excerpt cap for stored result logs (100-5000)
error_tail_chars = 500               # stderr/stdout tail stored on failure (0 disables the tail)
driver_log_max_bytes = 10485760      # driver-era log-rotation knob (tolerated)
driver_log_keep_files = 10           # driver-era log-rotation knob (tolerated)
usage_summary = true                 # driver-era usage JSONL knob (tolerated)

[output_control.profiles.normal]
soft_result_chars = 1600
max_bullets = 8
[output_control.profiles.compact]
soft_result_chars = 900
max_bullets = 5
[output_control.profiles.micro]
soft_result_chars = 500
max_bullets = 3

# Per-role profile. guardian/concierge stay normal so warnings/approvals are not
# pressured short; scout/observer are micro (their detail lives in the artifact).
[output_control.roles]
pm = "normal"
dock = "compact"
worker = "compact"
smith = "compact"
artisan = "compact"
scout = "micro"
observer = "micro"
librarian = "compact"
guardian = "normal"
concierge = "normal"

# === Setup completion marker ===
#
# Written by the wizard as its last step. PM treats a project as fully
# initialized only when [setup] complete = true is present. If absent,
# the project is a partial install (wizard crashed or was killed
# mid-run) and PM will rerun the wizard, which offers a cleanup of any
# leftover __garelier/ scaffolding before retrying fresh init.

[setup]
complete = true
completed_at = "{{ISO8601_timestamp}}"
wizard_version = "2.10.0"

# === Optional: Autonomous dispatch loop ===
#
# Garelier can self-pace toward a goal on large, long-running roadmaps
# (dispatch-only, DEC-061/066: the attended PM/Dock session arms a
# self-paced /loop; roles run as in-session subagents / `codex exec`).
# The top-level switch is `enabled`. When false (default), Garelier behaves
# as a classic setup with all user-confirmation gates intact; one-off
# dispatches need no [autonomy] at all.
#
# When enabled = true:
#   - PM skips blueprint-drafting and milestone confirmation per the
#     auto_approve_* flags below
#   - each tick runs DISPATCH -> GATE (Guardian -> Observer) -> INTEGRATE ->
#     RECORD; the [jig] block above (DEC-062, default-on) executes the tick
#     as code, and the four HARD human-decision gates always park to PM
#     (see garelier-pm/references/autonomous-mode.md)
#
# Promote flow (studio -> target merge) ALWAYS requires explicit user
# instruction, even when the loop is armed. PM records the approval and
# Concierge executes it; there is no PM fallback and no auto_promote flag.
#
# [autonomy]
# enabled = false                          # arm the self-paced /loop (opt-in)
# auto_approve_blueprints = false          # PM auto-proceeds on its own judgment (soft-gate collapse)
# auto_approve_milestones = false          # milestone bookkeeping commits without confirmation
# auto_proxy_commit = false                # validate Codex COMMIT PLAN, proxy-commit with commit -F, fill followup template, then resume
#
# No fan_out_cap: tick admission uses current provider/host/resource telemetry.
# # (require_for_all_merges is NOT an [autonomy] key — it lives in
# #  [guardian_policy] / [observer_policy] above; keep it true there.)
# protected_paths = [                      # HARD gates to the human PM (core/protected paths)
#   "src/core/**", "<dependency-manifest>", "<lockfile>", ".github/**", "infra/**", "deploy/**", "migrations/**",
# ]
